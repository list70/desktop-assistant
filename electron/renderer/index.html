<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Desktop Assistant</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="drag-region">
    <span>AIアシスタント</span>
    <div class="window-controls">
      <button id="minimize-btn">_</button>
      <button id="settings-btn" title="設定を開く" aria-label="設定を開く">⚙</button>
    </div>
  </div>

  <div id="character-container">
    <canvas id="character-canvas"></canvas>
  </div>

  <div id="chat-panel">
    <div id="status-indicator">
      <span class="status-dot offline" id="status-dot"></span>
      <span class="status-text" id="status-text">オフライン</span>
    </div>
    
    <div id="chat-messages">
      <div id="thinking-indicator" style="display: none;">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
    
    <div id="input-area">
      <button id="mic-btn">🎙</button>
      <input type="text" id="message-input" placeholder="メッセージを入力...">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <div id="settings-modal" class="settings-overlay" hidden aria-hidden="true">
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-heading">
        <h2 id="settings-title">設定</h2>
        <button id="settings-close-btn" class="settings-close" type="button" aria-label="閉じる">×</button>
      </div>
      <label class="setting-label" for="llm-model-select">Ollamaモデル</label>
      <div class="model-picker">
        <select id="llm-model-select" disabled>
          <option value="">モデル一覧を読み込み中…</option>
        </select>
        <button id="refresh-models-btn" type="button" title="モデル一覧を更新" aria-label="モデル一覧を更新">↻</button>
      </div>
      <p class="setting-help">Ollamaでダウンロード済みのモデルから選択できます。</p>
      <p id="settings-status" class="settings-status" role="status" aria-live="polite"></p>
      <div class="settings-actions">
        <button id="settings-cancel-btn" class="settings-secondary" type="button">閉じる</button>
        <button id="settings-save-btn" class="settings-primary" type="button" disabled>保存</button>
      </div>
    </section>
  </div>

  <script type="module" src="character.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="voice-input.js"></script>
  <script type="module" src="voice-output.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
